# lanzadera — mini-DAW de improvisación en vivo (workspace)
[workspace]
resolver = "2"
members = ["core", "engine", "controller", "ui", "app"]
exclude = ["vendor/vst3-host"]

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# vst3-host 0.11.1 (MIT) con un parche: la "Plugin Compatibility Class" que
# no se puede instanciar (yabridge) ya no aborta la carga. Ver vendor/vst3-host.
[patch.crates-io]
vst3-host = { path = "vendor/vst3-host" }
