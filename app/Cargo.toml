[package]
license = "AGPL-3.0-or-later"
name = "lanzadera"
version = "0.1.0"
edition = "2021"

[dependencies]
lanzadera-core       = { path = "../core" }
lanzadera-engine     = { path = "../engine" }
lanzadera-controller = { path = "../controller" }
lanzadera-ui         = { path = "../ui" }
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[features]
jack = ["lanzadera-engine/jack"]
clap = ["lanzadera-engine/clap"]
vst3 = ["clap", "lanzadera-engine/vst3"]
